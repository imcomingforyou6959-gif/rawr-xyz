<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Rawr.xyz</title>
  <meta name="description" content="rawr.xyz made for u">
  <meta name="theme-color" content="#000000">

  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            surface: '#0b0b0b',
            accent: '#ef4444',
            muted: '#a1a1aa',
            border: 'rgba(255,255,255,0.06)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      position: relative;
      overflow-x: hidden;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://github.com/dharmx/walls/blob/main/calm/a_large_waterfall_with_fog_and_trees.jpg?raw=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.5) saturate(0.8);
      z-index: 0;
      opacity: 0.6;
    }

    .content-layer {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card-3d {
      perspective: 1000px;
    }

    .card-3d-inner {
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
    }

    .glass {
      background: rgba(20, 20, 20, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-hover:hover {
      background: rgba(30, 30, 30, 0.4);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .nav-pill {
      transition: all 0.3s ease;
      background: rgba(20, 20, 20, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-pill.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
      font-weight: 600;
    }

    .nav-pill:hover:not(.active) {
      background: rgba(30, 30, 30, 0.4);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .fade-in-delay-1 {
      animation-delay: 0.3s;
    }

    .fade-in-delay-2 {
      animation-delay: 0.6s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .pulse-red {
      animation: pulseRed 2s infinite;
    }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .script-card {
      background: rgba(15, 15, 15, 0.4);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    .script-card:hover {
      background: rgba(20, 20, 20, 0.5);
      border-color: rgba(239, 68, 68, 0.25);
      transform: translateY(-2px);
    }

    .search-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-card {
      animation: modalIn 0.2s ease forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <script>
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('root').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;color:#ef4444;font-family:sans-serif;">
          <p>⚠️ Could not load core libraries. Check connection.</p>
        </div>`;
      throw new Error('React not available');
    }

    const { useState, useEffect, useRef, useMemo } = React;

    const ConfirmModal = ({ open, onCancel, onConfirm, onLibrary }) => {
      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open, onCancel]);

      if (!open) return null;

      return React.createElement('div', {
        className: "fixed inset-0 z-[100] flex items-center justify-center p-4",
        style: { background: 'rgba(0, 0, 0, 0.55)', backdropFilter: 'blur(6px)' },
        onClick: onCancel
      },
        React.createElement('div', {
          className: "modal-card w-full max-w-md rounded-2xl overflow-hidden",
          style: {
            background: 'rgba(20, 20, 20, 0.35)',
            backdropFilter: 'blur(20px)',
            border: '1px solid rgba(239, 68, 68, 0.3)',
            boxShadow: '0 0 0 1px rgba(239, 68, 68, 0.15), 0 20px 60px rgba(0, 0, 0, 0.6)'
          },
          onClick: (e) => e.stopPropagation()
        },
          // Header
          React.createElement('div', {
            className: "flex items-center gap-3 px-5 py-4",
            style: {
              borderBottom: '1px solid rgba(255, 255, 255, 0.08)',
              background: 'rgba(10, 10, 10, 0.25)'
            }
          },
            React.createElement('div', {
              className: "w-9 h-9 rounded-full flex items-center justify-center shrink-0",
              style: { background: 'rgba(239, 68, 68, 0.12)', border: '1px solid rgba(239, 68, 68, 0.3)' }
            },
              React.createElement('i', { className: "fas fa-circle-info text-red-400 text-sm" })
            ),
            React.createElement('h3', { className: "text-white/90 font-semibold text-base" }, "Main script — heads up")
          ),
          // Body
          React.createElement('div', { className: "px-5 py-5" },
            React.createElement('p', { className: "text-white/70 text-sm leading-relaxed mb-3" },
              "Are you sure you would like to copy this to your clipboard?"
            ),
            React.createElement('p', { className: "text-white/50 text-sm leading-relaxed mb-4" },
              "This is our ",
              React.createElement('span', { className: "text-white/80 font-medium" }, "main script"),
              " — it is not the same as the other scripts. If you were looking for something else, check out the Script Library."
            ),
            React.createElement('button', {
              onClick: onLibrary,
              className: "inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-lg text-white/60 hover:text-white/90 transition-colors",
              style: { background: 'rgba(255, 255, 255, 0.05)', border: '1px solid rgba(255, 255, 255, 0.1)' }
            },
              React.createElement('i', { className: "fas fa-arrow-right text-[10px]" }),
              "Click to go to Script Library"
            )
          ),

          React.createElement('div', {
            className: "flex gap-2 px-5 py-4",
            style: { borderTop: '1px solid rgba(255, 255, 255, 0.06)' }
          },
            React.createElement('button', {
              onClick: onCancel,
              className: "flex-1 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:text-white/80 transition-colors",
              style: { background: 'rgba(255, 255, 255, 0.04)', border: '1px solid rgba(255, 255, 255, 0.08)' }
            }, "Cancel"),
            React.createElement('button', {
              onClick: onConfirm,
              className: "flex-1 py-2.5 rounded-xl text-sm font-medium text-white/80 hover:text-white transition-colors",
              style: { background: 'rgba(255, 255, 255, 0.07)', border: '1px solid rgba(255, 255, 255, 0.12)' }
            }, "Copy anyway")
          )
        )
      );
    };

    const MainCard = () => {
      const [copied, setCopied] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [config, setConfig] = useState({ version: "v4.5.1", status: "operational", statusColor: "#22c55e" });
      const cardRef = useRef(null);
      const [rotate, setRotate] = useState({ x: 0, y: 0 });

      const scriptText = `loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()`;

      useEffect(() => {
        const url = `https://raw.githubusercontent.com/imcomingforyou6959-gif/rawr.xyl/refs/heads/main/status.json?t=${Date.now()}`;
        fetch(url)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && data.version) setConfig(data);
            else setConfig({ version: "v4.5.1", status: "online", statusColor: "#22c55e" });
          })
          .catch(() => setConfig({ version: "v4.5.1", status: "online", statusColor: "#22c55e" }));
      }, []);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 15;
        const rotateY = (centerX - x) / 15;
        setRotate({ x: rotateX, y: rotateY });
      };

      const handleMouseLeave = () => {
        setRotate({ x: 0, y: 0 });
      };

      const goToLibrary = () => {
        setShowConfirm(false);
        const evt = new CustomEvent('rawr:navigate', { detail: 'scripts' });
        window.dispatchEvent(evt);
      };

      const doCopy = async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(scriptText);
          } else {
            const ta = document.createElement("textarea");
            ta.value = scriptText;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch (e) {
          console.warn('copy failed', e);
        }
      };

      const handleCopyClick = () => {
        setShowConfirm(true);
      };

      const handleConfirmCopy = () => {
        setShowConfirm(false);
        doCopy();
      };

      return React.createElement(React.Fragment, null,
        React.createElement(ConfirmModal, {
          open: showConfirm,
          onCancel: () => setShowConfirm(false),
          onConfirm: handleConfirmCopy,
          onLibrary: goToLibrary
        }),
        React.createElement('div', { className: "w-full max-w-xl mx-auto mt-8 card-3d fade-in fade-in-delay-2" },
          React.createElement('div', {
            ref: cardRef,
            onMouseMove: handleMouseMove,
            onMouseLeave: handleMouseLeave,
            className: "card-3d-inner rounded-2xl overflow-hidden",
            style: { 
              transform: `perspective(1000px) rotateX(${rotate.x}deg) rotateY(${rotate.y}deg)`,
              background: 'rgba(15, 15, 15, 0.35)',
              backdropFilter: 'blur(20px)',
              border: '1px solid rgba(255, 255, 255, 0.1)'
            }
          },
            React.createElement('div', { 
              className: "flex items-center justify-between px-5 py-3",
              style: { 
                borderBottom: '1px solid rgba(255, 255, 255, 0.08)',
                background: 'rgba(10, 10, 10, 0.3)'
              }
            },
              React.createElement('div', { className: "flex items-center gap-3" },
                React.createElement('div', { className: "flex gap-1.5" },
                  React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-red-500/80" }),
                  React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-yellow-500/80" }),
                  React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-green-500/80" })
                ),
                React.createElement('span', { className: "text-xs font-mono text-white/50" }, config.version)
              ),
              React.createElement('div', { className: "flex items-center gap-2" },
                React.createElement('span', { className: "w-2 h-2 bg-green-400 rounded-full animate-pulse" }),
                React.createElement('span', { className: "text-xs font-mono uppercase text-white/50" }, config.status)
              )
            ),
            React.createElement('div', { className: "p-5" },
              React.createElement('div', { 
                className: "rounded-xl p-4 mb-4 font-mono text-sm break-all select-all",
                style: {
                  background: 'rgba(0, 0, 0, 0.4)',
                  border: '1px solid rgba(239, 68, 68, 0.15)',
                  color: '#fca5a5'
                }
              },
                scriptText
              ),
              React.createElement('button', {
                onClick: handleCopyClick,
                className: `w-full py-3 rounded-xl font-semibold text-sm transition-all pulse-red ${
                  copied ? 'bg-green-500/20 border border-green-400/30 text-green-400' : 
                  'text-red-400 hover:text-red-300'
                }`,
                style: {
                  background: copied ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.1)',
                  backdropFilter: 'blur(8px)',
                  border: copied ? '1px solid rgba(34, 197, 94, 0.3)' : '1px solid rgba(239, 68, 68, 0.2)'
                }
              },
                copied ? '✓ Copied' : 'Copy Script'
              )
            )
          )
        )
      );
    };

    const ScriptCard = ({ script, copiedId, onCopy }) => {
      const [expanded, setExpanded] = useState(false);
      const isCopied = copiedId === script.id;

      return React.createElement('div', {
        className: "script-card rounded-xl p-5 fade-in flex flex-col",
        style: { animationDelay: `${0.1 * (script.id % 8)}s` }
      },

        React.createElement('div', { className: "flex justify-between items-start mb-2 gap-2" },
          React.createElement('div', { className: "min-w-0 flex-1" },
            React.createElement('h3', { className: "text-white font-semibold text-lg truncate" }, script.name),
            React.createElement('p', { className: "text-white/50 text-sm mt-0.5 line-clamp-1" }, script.desc)
          ),
          React.createElement('span', { 
            className: "text-xs px-2 py-0.5 rounded font-mono shrink-0",
            style: {
              background: 'rgba(239, 68, 68, 0.1)',
              color: '#fca5a5',
              border: '1px solid rgba(239, 68, 68, 0.15)'
            }
          }, script.version)
        ),

        React.createElement('div', { className: "flex flex-wrap gap-2 mb-3" },
          script.tags.map(tag => React.createElement('span', { 
            key: tag, 
            className: "text-[10px] px-2 py-0.5 rounded uppercase tracking-wider",
            style: {
              background: 'rgba(255, 255, 255, 0.05)',
              color: 'rgba(255, 255, 255, 0.4)',
              border: '1px solid rgba(255, 255, 255, 0.08)'
            }
          }, tag))
        ),

        React.createElement('div', {
          className: "relative rounded-lg p-3 mb-3 font-mono text-xs break-all cursor-pointer transition-all",
          style: {
            background: 'rgba(0, 0, 0, 0.4)',
            border: '1px solid rgba(239, 68, 68, 0.15)',
            color: '#fca5a5',
            maxHeight: expanded ? 'none' : '4.5rem',
            overflow: 'hidden'
          },
          onClick: () => setExpanded(!expanded)
        },
          script.loadstring,
          !expanded && React.createElement('div', {
            className: "absolute bottom-0 left-0 right-0 h-8",
            style: { background: 'linear-gradient(transparent, rgba(0,0,0,0.8))' }
          }),
          React.createElement('button', {
            className: "absolute top-2 right-2 text-[10px] px-1.5 py-0.5 rounded text-white/40 hover:text-white/70 transition-colors",
            style: { background: 'rgba(0,0,0,0.5)' },
            onClick: (e) => { e.stopPropagation(); setExpanded(!expanded); }
          }, expanded ? '−' : '+')
        ),

        // Copy button
        React.createElement('button', {
          onClick: () => onCopy(script.loadstring, script.id),
          className: `mt-auto w-full py-2.5 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2 ${
            isCopied ? 'text-green-400' : 'text-red-400 hover:text-red-300'
          }`,
          style: {
            background: isCopied ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.08)',
            backdropFilter: 'blur(8px)',
            border: isCopied ? '1px solid rgba(34, 197, 94, 0.3)' : '1px solid rgba(239, 68, 68, 0.15)'
          }
        },
          React.createElement('i', { className: `fas ${isCopied ? 'fa-check' : 'fa-copy'} text-xs` }),
          isCopied ? 'Copied' : 'Copy Script'
        )
      );
    };

    const ScriptsGrid = () => {
      const [copiedId, setCopiedId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      const scripts = [
        { id: 1, name: "Universal Old", desc: "Legacy script, maintained for compatibility", version: "2.3.1", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/Universal.lua", true))()', tags: ["stable", "legacy"] },
        { id: 2, name: "Hellmet", desc: "Little old project with ESP & aim assist", version: "1.1.5", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/Hellmet.lua"))()', tags: ["esp", "aim"] },
        { id: 3, name: "Prison Life", desc: "Full featured Prison Life script", version: "4.9.8.9", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()', tags: ["prison", "stable"] },
        { id: 4, name: "Rivals", desc: "PvP focused combat script", version: "4.6.3", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()', tags: ["pvp", "combat"] },
        { id: 5, name: "Dahood Copies", desc: "Works on zee hood, der hood, dev hood and more", version: "idk", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/rawrrunsts.txt"))()', tags: ["experimental", "hood"] },
        { id: 6, name: "TTK Testing", desc: "TTK testing tool for you", version: "1.0.3", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/ttk.txt"))()', tags: ["hvh", "testing"] },
        { id: 7, name: "Arsenal", desc: "Arsenal script I guess", version: "1.0.0", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/arc.txt"))()', tags: ["arsenal", "fps"] },
        { id: 8, name: "Slendytubbies vs Redux", desc: "Lard tub tub approved", version: "1.0.0", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/tubbies.txt", true))()', tags: ["tubbiee", "horror"] }
      ];

      const filteredScripts = useMemo(() => {
        const q = searchQuery.toLowerCase();
        return scripts.filter(script => {
          if (!q) return true;
          return (
            script.name.toLowerCase().includes(q) ||
            script.desc.toLowerCase().includes(q)
          );
        });
      }, [searchQuery]);

      const copy = async (text, id) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1800);
        } catch (e) {}
      };

      return React.createElement('div', { className: "w-full max-w-6xl mx-auto px-4 py-12" },

        React.createElement('div', { className: "text-center mb-10" },
          React.createElement('h2', { className: "text-4xl font-bold text-white mb-2 fade-in" },
            "Script ", React.createElement('span', { className: "text-red-400" }, "Library")
          ),
          React.createElement('p', { className: "text-white/40 text-sm font-mono fade-in fade-in-delay-1" },
            `${scripts.length} scripts · curated & updated`
          )
        ),

        React.createElement('div', { className: "mb-8 fade-in fade-in-delay-1" },
          React.createElement('div', { className: "relative max-w-md mx-auto" },
            React.createElement('i', { className: "fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/30 text-sm" }),
            React.createElement('input', {
              type: 'text',
              placeholder: 'Search scripts or descriptions...',
              value: searchQuery,
              onChange: (e) => setSearchQuery(e.target.value),
              className: "search-input w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white/80 placeholder-white/30"
            }),
            searchQuery && React.createElement('button', {
              onClick: () => setSearchQuery(''),
              className: "absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors"
            },
              React.createElement('i', { className: "fas fa-times text-xs" })
            )
          )
        ),

        searchQuery && React.createElement('div', { className: "text-center mb-4 text-xs text-white/40 font-mono" },
          `Found ${filteredScripts.length} script${filteredScripts.length !== 1 ? 's' : ''}`,
          ` matching "${searchQuery}"`,
          React.createElement('button', {
            onClick: () => setSearchQuery(''),
            className: "ml-3 text-red-400/70 hover:text-red-400 underline transition-colors"
          }, 'Clear search')
        ),

        filteredScripts.length > 0 ?
          React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" },
            filteredScripts.map(script =>
              React.createElement(ScriptCard, {
                key: script.id,
                script: script,
                copiedId: copiedId,
                onCopy: copy
              })
            )
          )
          :
          React.createElement('div', { className: "text-center py-16 fade-in" },
            React.createElement('i', { className: "fas fa-search text-4xl text-white/10 mb-4" }),

            React.createElement('p', { className: "text-white/20 text-xs mt-1" }, 'Try a different search')

    };

    const App = () => {
      const [page, setPage] = useState('home');

      useEffect(() => {
        const onNavigate = (e) => setPage(e.detail);
        window.addEventListener('rawr:navigate', onNavigate);
        return () => window.removeEventListener('rawr:navigate', onNavigate);
      }, []);

      const navItems = [
        { id: 'home', label: 'Home', icon: 'fa-house' },
        { id: 'scripts', label: 'Scripts', icon: 'fa-scroll' }

      return React.createElement('div', { className: "relative min-h-screen w-full text-white font-sans" },
        React.createElement('div', { className: "bg-image" }),
        
        React.createElement('div', { className: "content-layer" },
          React.createElement('div', { className: "relative z-20 flex gap-1.5 mb-8 p-1 rounded-full fade-in",
            style: {
              background: 'rgba(15, 15, 15, 0.3)',
              backdropFilter: 'blur(12px)',
              border: '1px solid rgba(255, 255, 255, 0.08)'
            }
          },
            navItems.map(item =>
              React.createElement('button', {
                key: item.id,
                onClick: () => setPage(item.id),
                className: `px-5 py-2 rounded-full text-sm font-medium flex items-center gap-2 nav-pill ${page === item.id ? 'active' : ''}`
              },
                React.createElement('i', { className: `fas ${item.icon} text-xs` }),
                item.label
              )
            )
          ),

          page === 'home' ?
            React.createElement('div', { className: "flex flex-col items-center w-full" },
              React.createElement('img', {
                src: "assets/logo.png",
                alt: "rawr",
                className: "w-24 h-24 sm:w-36 sm:h-36 object-contain mb-6 float fade-in",
                onError: (e) => { e.target.style.display = 'none'; }
              }),
              React.createElement('h1', { className: "text-5xl sm:text-6xl font-extrabold tracking-tighter text-white/90 fade-in fade-in-delay-1" },
                "rawr", React.createElement('span', { className: "text-red-400" }, ".xyz")
              ),
              React.createElement('p', { className: "text-white/30 text-xs tracking-[0.4em] uppercase mt-2 font-mono fade-in fade-in-delay-2" }, "running the scene since early 2026"),
              
              React.createElement('div', { className: "flex flex-wrap justify-center gap-4 mt-8 mb-6 fade-in fade-in-delay-2" },
                React.createElement('a', { 
                  href: "https://discord.gg/eMpUQzFrNG", 
                  target: "_blank", 
                  rel: "noopener", 
                  className: "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm text-white/70 hover:text-white/90 transition-all glass glass-hover"
                },
                  React.createElement('i', { className: "fa-brands fa-discord" }), "Discord"
                ),
                React.createElement('a', { 
                  href: "https://www.youtube.com/@rawr.xy3", 
                  target: "_blank", 
                  rel: "noopener", 
                  className: "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm text-white/70 hover:text-white/90 transition-all glass glass-hover"
                },
                  React.createElement('i', { className: "fa-brands fa-youtube" }), "YouTube"
                )
              ),
              React.createElement(MainCard, null)
            )
            :
            React.createElement(ScriptsGrid, null),

          React.createElement('footer', { className: "mt-16 z-20 text-center w-full max-w-2xl fade-in" },
            React.createElement('div', { className: "text-[10px] text-white/20 font-mono tracking-widest uppercase mb-3" }, "rawr.xyz · find a way"),
            React.createElement('div', { className: "flex flex-wrap justify-center gap-x-6 gap-y-2 text-xs text-white/25" },
              React.createElement('span', { className: "cursor-pointer hover:text-red-400 transition-colors", onClick: () => setPage('home') }, "Home"),
              React.createElement('span', { className: "cursor-pointer hover:text-red-400 transition-colors", onClick: () => setPage('scripts') }, "Scripts"),
              React.createElement('a', { href: "/tos", className: "hover:text-red-400 transition-colors" }, "Terms"),
              React.createElement('a', { href: "/privacy", className: "hover:text-red-400 transition-colors" }, "Privacy"),
              React.createElement('a', { href: "https://discord.gg/eMpQzFrNG", target: "_blank", rel: "noopener", className: "hover:text-red-400 transition-colors" }, "Support")
            ),
            React.createElement('p', { className: "text-[9px] text-white/10 mt-3" }, "© 2026 rawr.xyz")
          )
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
