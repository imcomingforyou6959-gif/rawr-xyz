<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>rawr.xyz — Home</title>
  <meta name="description" content="rawr.xyz made for u">
  <meta name="theme-color" content="#0a0a0a">

  <!-- favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- fonts & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- tailwind via cdn (stable) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            surface: '#0b0b0b',
            accent: '#f97316',
            muted: '#a1a1aa',
            border: 'rgba(255,255,255,0.06)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      background-color: #080808;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.035"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    .rain-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
      pointer-events: none !important;
      opacity: 0.12 !important;
    }

    .content-layer {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card-hover {
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
    }
    .card-hover:hover {
      border-color: rgba(249, 115, 22, 0.25);
      background-color: rgba(255,255,255,0.02);
      transform: translateY(-1px);
    }

    .nav-pill {
      transition: all 0.2s ease;
    }
    .nav-pill.active {
      background: #f97316;
      color: #0a0a0a;
      font-weight: 600;
    }

    .glow-text {
      text-shadow: 0 0 15px rgba(249,115,22,0.3);
    }

    hr.subtle {
      border-color: rgba(255,255,255,0.05);
    }

    button, a {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- react / react-dom production -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <script>
    // safety check
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('root').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;color:#f97316;font-family:sans-serif;">
          <p>⚠️ Could not load core libraries. Check connection.</p>
        </div>`;
      throw new Error('React not available');
    }

    const { useState, useEffect, useRef } = React;

    const AmbientCanvas = ({ speed = 0.8 }) => {
      const canvasRef = useRef(null);
      const mouse = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationId;
        let particles = [];
        const MAX = 280;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };

        const createParticle = () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 14 + 6,
          speed: Math.random() * 8 + 4,
          opacity: Math.random() * 0.25 + 0.06,
          drift: (Math.random() - 0.5) * 1.2,
        });

        for (let i = 0; i < MAX; i++) particles.push(createParticle());

        const handleMouse = (e) => {
          mouse.current.x = (e.clientX / window.innerWidth) - 0.5;
          mouse.current.y = (e.clientY / window.innerHeight) - 0.5;
        };

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const offsetX = mouse.current.x * 45;
          const tilt = mouse.current.x * 4;

          particles.forEach(p => {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(249, 115, 22, ${p.opacity})`;
            ctx.lineWidth = 1.2;
            ctx.moveTo(p.x + offsetX, p.y);
            ctx.lineTo(p.x + offsetX + tilt, p.y + p.length);
            ctx.stroke();

            p.y += p.speed * speed;
            p.x += (p.drift + mouse.current.x * 7) * speed;

            if (p.y > canvas.height + 15) {
              p.y = -15;
              p.x = Math.random() * canvas.width;
            }
            if (p.x > canvas.width) p.x = 0;
            if (p.x < 0) p.x = canvas.width;
          });

          animationId = requestAnimationFrame(draw);
        };

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', handleMouse);
        resize();
        draw();

        return () => {
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMouse);
          cancelAnimationFrame(animationId);
        };
      }, [speed]);

      return React.createElement('canvas', {
        ref: canvasRef,
        className: 'rain-canvas',
        style: { filter: 'blur(1px)' }
      });
    };

    const ScriptHero = () => {
      const [copied, setCopied] = useState(false);
      const [config, setConfig] = useState({ version: "v4.5.1", status: "operational", statusColor: "#22c55e" });

      const scriptText = `loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()`;

      useEffect(() => {
        const url = `https://raw.githubusercontent.com/imcomingforyou6959-gif/rawr.xyl/refs/heads/main/status.json?t=${Date.now()}`;
        fetch(url)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && data.version) setConfig(data);
            else setConfig({ version: "v4.5.1", status: "online", statusColor: "#22c55e" });
          })
          .catch(() => setConfig({ version: "v4.5.1", status: "online", statusColor: "#22c55e" }));
      }, []);

      const copyToClipboard = async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(scriptText);
          } else {
            const ta = document.createElement("textarea");
            ta.value = scriptText;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch (e) {
          console.warn('copy failed', e);
        }
      };

      const statusDot = config.statusColor === "#22c55e" ? "bg-green-500" : (config.statusColor === "red" ? "bg-red-500" : "bg-yellow-500");

      return React.createElement('div', { className: "w-full max-w-xl mx-auto mt-10" },
        React.createElement('div', { className: "bg-[#0f0f0f] border border-[#ffffff10] rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md" },
          // header
          React.createElement('div', { className: "flex items-center justify-between px-5 py-3 border-b border-[#ffffff10] bg-[#ffffff04]" },
            React.createElement('div', { className: "flex items-center gap-3" },
              React.createElement('div', { className: "flex gap-1.5" },
                React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-[#ff5f56]" }),
                React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-[#ffbd2e]" }),
                React.createElement('span', { className: "w-2.5 h-2.5 rounded-full bg-[#27c93f]" })
              ),
              React.createElement('span', { className: "text-xs font-mono text-white/40 bg-white/5 px-2 py-0.5 rounded-md" }, config.version)
            ),
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement('span', { className: `relative flex h-2.5 w-2.5 ${statusDot} rounded-full` },
                React.createElement('span', { className: "animate-ping absolute inline-flex h-full w-full rounded-full opacity-60" })
              ),
              React.createElement('span', { className: "text-xs font-mono uppercase tracking-widest text-white/60 font-medium" }, config.status)
            )
          ),
          // body
          React.createElement('div', { className: "p-5" },
            React.createElement('div', { className: "bg-black/40 border border-white/5 rounded-xl p-4 mb-4 font-mono text-sm text-orange-300/80 break-all select-all" },
              scriptText
            ),
            React.createElement('button', {
              onClick: copyToClipboard,
              className: `w-full py-3.5 rounded-xl font-semibold text-sm tracking-wide transition-all border border-orange-500/30 bg-orange-500/10 hover:bg-orange-500/20 text-white flex items-center justify-center gap-2 ${copied ? 'bg-green-500/20 border-green-500/40' : ''}`
            },
              copied ? '✓ Copied' : 'Copy script'
            )
          )
        ),
        // clean
        React.createElement('div', { className: "mt-5 text-center text-xs text-white/30 font-mono flex flex-wrap items-center justify-center gap-x-5 gap-y-2" },
          React.createElement('span', null, "Xeno"),
          React.createElement('span', { className: "text-white/15" }, "•"),
          React.createElement('span', null, "Velocity"),
          React.createElement('span', { className: "text-white/15" }, "•"),
          React.createElement('span', null, "Solara"),
          React.createElement('span', { className: "text-white/15" }, "•"),
          React.createElement('span', null, "Volt"),
          React.createElement('span', { className: "text-white/15" }, "•"),
          React.createElement('span', { className: "text-white/25 italic" }, "& more")
        )
      );
    };

    const ScriptsLibrary = () => {
      const [copiedId, setCopiedId] = useState(null);

      const scripts = [
        { id: 1, name: "Universal Old", desc: "Legacy", version: "2.3.1", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/Universal.lua", true))()', tags: ["stable"] },
        { id: 2, name: "Hellmet", desc: "little old project", version: "1.1.5", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/Hellmet.lua"))()', tags: ["esp", "aim"] },
        { id: 3, name: "Prison Life", desc: "Prison", version: "4.9.7", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()', tags: ["prison"] },
        { id: 4, name: "Rivals", desc: "PvP", version: "4.9.6", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/file.txt", true))()', tags: ["pvp"] },
        { id: 5, name: "Dahood Copys", desc: "works on zee hood, der hood, dev hood and more", version: "idk", loadstring: 'loadstring(game:HttpGet("https://rawrs.zapto.org/rawrrunsts.txt"))()', tags: ["experimental"] },
        { id: 6, name: "nil", desc: "placeholder", version: "3.0.2", loadstring: 'nil', tags: ["placeholder"] }
      ];

      const copy = async (text, id) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1800);
        } catch (e) {}
      };

      return React.createElement('div', { className: "w-full max-w-6xl mx-auto px-4 py-12" },
        React.createElement('h2', { className: "text-4xl font-bold text-white text-center mb-2 tracking-tight" },
          "Script ", React.createElement('span', { className: "text-accent" }, "Library")
        ),
        React.createElement('p', { className: "text-center text-white/40 text-sm mb-10 font-mono" }, "curated & frequently updated"),
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" },
          scripts.map(script =>
            React.createElement('div', {
              key: script.id,
              className: "bg-[#0f0f0f] border border-[#ffffff10] rounded-xl p-5 card-hover flex flex-col"
            },
              React.createElement('div', { className: "flex justify-between items-start mb-2" },
                React.createElement('h3', { className: "text-white font-semibold text-lg" }, script.name),
                React.createElement('span', { className: "text-xs bg-white/5 text-white/60 px-2 py-0.5 rounded font-mono" }, script.version)
              ),
              React.createElement('p', { className: "text-white/50 text-sm mb-3" }, script.desc),
              React.createElement('div', { className: "flex flex-wrap gap-2 mb-4" },
                script.tags.map(tag => React.createElement('span', { key: tag, className: "text-[10px] bg-white/5 text-white/40 px-2 py-0.5 rounded uppercase tracking-wider" }, tag))
              ),
              React.createElement('div', { className: "bg-black/30 border border-white/5 rounded-lg p-3 mb-3 font-mono text-xs text-orange-300/70 break-all" }, script.loadstring),
              React.createElement('button', {
                onClick: () => copy(script.loadstring, script.id),
                className: "mt-auto w-full py-2.5 bg-white/5 border border-white/10 hover:border-orange-500/40 text-white/70 hover:text-white rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2"
              },
                copiedId === script.id ? '✓ Copied' : 'Copy'
              )
            )
          )
        )
      );
    };

    const App = () => {
      const [page, setPage] = useState('home');

      const navItems = [
        { id: 'home', label: 'Home', icon: 'fa-house' },
        { id: 'scripts', label: 'Scripts', icon: 'fa-scroll' }
      ];

      return React.createElement('div', { className: "relative min-h-screen w-full bg-[#080808] text-white font-sans" },
        React.createElement(AmbientCanvas, null),
        React.createElement('div', { className: "content-layer" },
          // navigation pills
          React.createElement('div', { className: "relative z-20 flex gap-1.5 mb-10 bg-white/5 p-1 rounded-full border border-white/10 backdrop-blur-sm" },
            navItems.map(item =>
              React.createElement('button', {
                key: item.id,
                onClick: () => setPage(item.id),
                className: `px-5 py-2 rounded-full text-sm font-medium flex items-center gap-2 nav-pill ${page === item.id ? 'active text-black' : 'text-white/50 hover:text-white/80'}`
              },
                React.createElement('i', { className: `fas ${item.icon} text-xs` }),
                item.label
              )
            )
          ),

          // page content
          page === 'home' ?
            React.createElement('div', { className: "flex flex-col items-center w-full" },
              React.createElement('img', {
                src: "assets/logo.png",
                alt: "rawr",
                className: "w-24 h-24 sm:w-36 sm:h-36 object-contain mb-6 opacity-90",
                onError: (e) => { e.target.style.display = 'none'; }
              }),
              React.createElement('h1', { className: "text-5xl sm:text-6xl font-extrabold tracking-tighter italic text-white" },
                "rawr", React.createElement('span', { className: "text-accent" }, ".xyz")
              ),
              React.createElement('p', { className: "text-white/25 text-xs tracking-[0.4em] uppercase mt-2 font-mono" }, "safety · execution"),
              React.createElement('div', { className: "flex flex-wrap justify-center gap-4 mt-8 mb-8" },
                React.createElement('a', { href: "https://discord.gg/eMpUQzFrNG", target: "_blank", rel: "noopener", className: "flex items-center gap-2 px-5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white/70 hover:text-white hover:border-orange-500/40 transition-all" },
                  React.createElement('i', { className: "fa-brands fa-discord" }), "Discord"
                ),
                React.createElement('a', { href: "https://github.com/imcomingforyou6959-gif/rawr.xyz", target: "_blank", rel: "noopener", className: "flex items-center gap-2 px-5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white/70 hover:text-white hover:border-orange-500/40 transition-all" },
                  React.createElement('i', { className: "fa-brands fa-github" }), "GitHub"
                ),
                React.createElement('a', { href: "https://www.youtube.com/@rawr.xy3", target: "_blank", rel: "noopener", className: "flex items-center gap-2 px-5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white/70 hover:text-white hover:border-orange-500/40 transition-all" },
                  React.createElement('i', { className: "fa-brands fa-youtube" }), "YouTube"
                )
              ),
              React.createElement(ScriptHero, null)
            )
            :
            React.createElement(ScriptsLibrary, null),

          // footer
          React.createElement('footer', { className: "mt-20 z-20 text-center w-full max-w-2xl" },
            React.createElement('div', { className: "text-[10px] text-white/15 font-mono tracking-widest uppercase mb-3" }, "rawr.xyz · find a way"),
            React.createElement('div', { className: "flex flex-wrap justify-center gap-x-6 gap-y-2 text-xs text-white/25" },
              React.createElement('span', { className: "cursor-pointer hover:text-white/60 transition-colors", onClick: () => setPage('home') }, "Home"),
              React.createElement('span', { className: "cursor-pointer hover:text-white/60 transition-colors", onClick: () => setPage('scripts') }, "Scripts"),
              React.createElement('a', { href: "/tos.html", className: "hover:text-white/60 transition-colors" }, "Terms"),
              React.createElement('a', { href: "/privacy.html", className: "hover:text-white/60 transition-colors" }, "Privacy"),
              React.createElement('a', { href: "https://discord.gg/eMpUQzFrNG", target: "_blank", rel: "noopener", className: "hover:text-white/60 transition-colors" }, "Support")
            ),
            React.createElement('p', { className: "text-[9px] text-white/10 mt-3" }, "© 2026 rawr.xyz")
          )
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
